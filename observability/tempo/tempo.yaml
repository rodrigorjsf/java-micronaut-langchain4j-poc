# Grafana Tempo, single binary, local disk.
#
# `backend: local` is a single-writer local-disk store. Tempo's own deployment-modes
# documentation says "Object storage is recommended for production deployments"; this is a
# laptop.

# Required for the Grafana Tempo data source's streaming search and streaming metrics.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
