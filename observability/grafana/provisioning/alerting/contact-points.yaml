# Where a firing alert goes. Provisioned as a file so this stack has no manual setup step,
# exactly like the data sources beside it.
#
# Schema: Grafana 13.2.0 (the image tag in compose.observability.yaml; /api/health reports
# version 13.2.0, commit f681b1359f). Field list read 2026-08-23 from
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# WHY THIS FILE EXISTS AT ALL. Grafana 13 ships exactly one receiver, named `empty`, and it
# has no integrations — the whole autogenerated policy tree routes to it. A rule wired to
# `empty` evaluates, turns red in the UI, and notifies nothing. That is not a contact point,
# it is a hole with a name, and it is the reason a rule file alone would not have been enough.
#
# WHY A WEBHOOK TO A PORT NOTHING LISTENS ON. This stack has no mail server, no Slack token
# and no Alertmanager, so every honest choice here fails to deliver. Given that, the choice
# is between failing VISIBLY and failing SILENTLY, and 127.0.0.1:9099 inside the Grafana
# container refuses the connection immediately: the failure lands in Grafana's own
# notification log (Alerting -> Notifications) with a timestamp, instead of a delivery that
# reports success into nowhere. Loud beats quiet when neither one works.
#
# THIS IS THE ONE LINE TO CHANGE. Point `url` at a real receiver, or replace the whole
# `receivers` entry with `type: slack` / `type: pagerduty` / `type: prometheus-alertmanager`.
# Nothing else in this directory needs to move: the notification policy routes by contact
# point NAME, not by uid or type.
#
# NO ${ENV_VAR} INTERPOLATION HERE, DELIBERATELY. Grafana expands provisioning files against
# the environment, and an unset variable expands to the empty string — which makes the
# contact point invalid, which makes the policy that references it invalid. That failure is
# logged once at startup and never mentioned again, leaving a Grafana that looks healthy and
# routes nothing. A literal placeholder cannot fail that way.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: agentic-local
    receivers:
      - uid: agentic-local-webhook
        type: webhook
        # Send the resolved notification too. An alert that clears and says nothing trains
        # a reader to assume anything still red is still broken, which is how a stale page
        # survives its own outage.
        disableResolveMessage: false
        settings:
          url: http://127.0.0.1:9099/alerts
          httpMethod: POST
