# The routing tree: which contact point a firing alert is handed to.
#
# Schema: Grafana 13.2.0. Field list read 2026-08-23 from
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# THE TREE IS A SINGLE RESOURCE, AND PROVISIONING IT OVERWRITES ALL OF IT. That is the
# documented behaviour ("Since the policy tree is a single resource, provisioning it will
# overwrite all policies"), not a side effect. What it overwrites here is Grafana 13's
# autogenerated tree, whose every branch routes to the built-in `empty` receiver — so the
# thing being destroyed is the reason alerts went nowhere. Read back what this replaced with
#   curl -s http://localhost:3001/api/alertmanager/grafana/config/api/v1/alerts
#
# ONE ROOT, NO CHILDREN, ON PURPOSE. Four rules do not need a routing tree; they need a
# route. Child policies are where severity-based fan-out would go (`routes:` with
# `object_matchers: [['severity','=','critical']]`), and adding one later does not disturb
# the root.
#
# THE ROOT IS NOT AN ORDINARY NODE. It may carry no `matchers`/`object_matchers` — a root
# that can fail to match is a root that drops alerts — and no `mute_time_intervals`, which
# Grafana rejects on the root specifically. Both restrictions are documented on the page
# above; neither is guessable from the child schema, which allows both.

apiVersion: 1

policies:
  - orgId: 1
    # Matches contactPoints[].name in contact-points.yaml. By name, not uid: this is the
    # seam that lets the contact point be swapped for Slack without editing this file.
    receiver: agentic-local
    # grafana_folder + alertname is Grafana's own default grouping, kept because it is the
    # right one here: all four rules live in one folder, so this groups by rule. Grouping by
    # '...' instead would send one notification per firing SERIES — and rule 1 is per
    # exporter, so a collector with both legs broken would page twice for one outage.
    group_by:
      - grafana_folder
      - alertname
    # Collect a few seconds of alerts before the first notification, so a stack that breaks
    # all at once arrives as one message rather than four.
    group_wait: 30s
    group_interval: 5m
    # Four hours between repeats of an alert that is still firing. Long, deliberately: none
    # of these four rules is actionable in under four hours by anyone reading a local stack,
    # and a re-notification that arrives faster than the fix teaches the reader to mute it.
    repeat_interval: 4h
